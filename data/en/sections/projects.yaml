- name: Council Rates & Water Bill Digitisation
  role: Tech Lead
  timeline: "2026"
  url: ""
  summary: >
    Automated ingestion and processing of council rate notices and water utility bills —
    extracting invoice data, validating against business rules, and feeding downstream
