- name: Community Housing Rent Calculator
  role: Tech Lead
  timeline: "2026"
  url: ""
  summary: >
    Automated rent reviews for a community housing provider managing hundreds of
    tenancies. Triggers calculations from within the housing platform, submits tenancy
    and income data to the Queensland Community Housing Rent Calculator (no public API),
    and writes results back as in-progress reviews — cutting processing time by around
    95%.
  tags: ["enterprise"]

- name: Audit Summaries
  image: images/sections/projects/ai-audit-summaries.png
  role: Developer
  timeline: "Dec 2025"
  url: "/posts/ai-audit-summaries/"
  summary: >
    LLM-powered summarisation of nearly two decades of audit comments into concise,
    actionable summaries, using a local model to keep commercially sensitive data
    private. Skyve's metadata made it straightforward to identify the relevant comment
    fields to include.
  tags: ["ai"]

